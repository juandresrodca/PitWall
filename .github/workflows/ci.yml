name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: dotnet test --project tests/PitWall.Core.Tests -c Release

      - name: Publish PitWall.exe
        run: dotnet publish src/PitWall.Desktop -c Release -r win-x64 -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: PitWall-win-x64
          path: dist/PitWall.exe
          if-no-files-found: error
